[package]
name = "record-prepress"
version = "0.1.0"
edition = "2021"
description = "WASM-compatible plant-ready prepress planning and export core for Bitneedle record plant artwork."
repository = "https://github.com/wavey-ai/vin.yl.prepress"
license = "MIT"

[features]
default = []
native-cli = ["anyhow"]

[[bin]]
name = "record-prepress"
path = "src/main.rs"
required-features = ["native-cli"]

[dependencies]
anyhow = { version = "1", optional = true }
flate2 = { version = "1", default-features = false, features = [
  "rust_backend",
] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
moxcms = { version = "0.8.1", default-features = false, features = ["lut"] }
record-plant = { git = "https://github.com/wavey-ai/vin.yl.plant.git", rev = "d2247d8f21ee232b6ec1b36c66df674a3a950c20" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Building this crate on its own picks up the sibling checkout, so the pair can
# be developed together. A consumer that depends on this crate resolves the
# pinned revision above instead — patches only apply to the crate being built.
[patch."https://github.com/wavey-ai/vin.yl.plant.git"]
record-plant = { path = "../vin.yl.plant" }
